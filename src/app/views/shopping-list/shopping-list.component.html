<breadcrumbs [items]="[{ 
    label: 'Lista de Compras', 
    icon: 'bi bi-card-list' 
}]"></breadcrumbs>
<form-shopping-list
    (oAddProduct)="addProduct($event)"
    (oSave)="saveShoppingList()"
    (oUpdateProduct)="updateProduct($event)"
></form-shopping-list>
<div class="py-2">
    <table-shopping-list
        (oDelete)="drop($event)"
        (oEdit)="edit($event)"
        [products]="items"
    ></table-shopping-list>
</div>
