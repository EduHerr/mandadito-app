<!-- VIEW MODE -->
@if(!editing){
<span
  class="name-view"
  (click)="startEdit()"
  title="Toca para editar el nombre"
>
  {{ name }}
  <i class="bi bi-pencil-fill edit-hint"></i>
</span>
}
@else{
<div class="name-edit-wrapper">
  <input
    #nameInput
    class="name-input"
    [(ngModel)]="tempName"
    (blur)="confirmEdit()"
    (keydown)="handleKey($event)"
    type="text"
    maxlength="40"
  />
</div>
}
