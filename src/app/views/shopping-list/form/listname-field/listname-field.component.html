<!-- VIEW MODE -->
@if(!editing){
<span
  class="name-view"
  (click)="startEdit()"
>
  {{ name }}
</span>
}
@else{
<div class="name-edit-wrapper">
  <input
    #nameInput
    class="name-input"
    [(ngModel)]="tempName"
    (keydown)="handleKey($event)"
    type="text"
  />

  <button class="close-btn" (click)="cancelEdit()">
    ✕
  </button>
</div>
}
