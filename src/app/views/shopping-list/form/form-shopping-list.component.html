<form [formGroup]="fShoppingList" class="form-card">
  <!-- Header: Name + Total -->
  <div class="form-header">
    <listname-field></listname-field>
    <div class="total-badge">
      <span class="total-label">Total</span>
      <span class="total-amount">${{ totalCost | number : "1.0-2" }}</span>
    </div>
  </div>

  <!-- Product name -->
  <div class="form-control">
    <div class="input-group">
      <i class="bi bi-tag input-icon"></i>
      <input type="text" placeholder="Nombre del producto" formControlName="name" />
    </div>
  </div>

  <!-- Quantity + Unit cost -->
  <div class="grid grid-cols-2 gap-3">
    <div class="form-control">
      <div class="input-group">
        <i class="bi bi-hash input-icon"></i>
        <numeric-field
          #cantiadadField
          [id]="'cantiadadField'"
          [min]="1"
          [max]="1000"
          [placeholder]="'Cantidad'"
        ></numeric-field>
      </div>
    </div>
    <div class="form-control">
      <div class="input-group">
        <i class="bi bi-currency-dollar input-icon"></i>
        <numeric-field
          #unitCostField
          [id]="'unitCostField'"
          [min]="1"
          [max]="100000"
          [placeholder]="'Precio'"
        ></numeric-field>
      </div>
    </div>
  </div>

  <!-- Description -->
  <div class="form-control">
    <textarea
      placeholder="Nota o descripción (opcional)"
      formControlName="description"
      rows="2"
    ></textarea>
  </div>

  <!-- Promo Toggle -->
  <label class="promo-toggle group">
    <input type="checkbox" formControlName="isPromo" class="promo-checkbox peer" />
    <span class="promo-label">Marcar como promoción (Ofertas, 3x2)</span>
    <i class="bi bi-tag-fill promo-icon"></i>
  </label>

  <!-- Actions -->
  <div class="form-actions">
    <button
      type="button"
      class="btn-save"
      title="Guardar lista"
      (click)="onSave()"
    >
      <i class="bi bi-floppy-fill"></i>
      <span>Guardar</span>
    </button>
    @if(!editMode){
    <button
      type="button"
      class="btn-add"
      title="Agregar producto"
      (click)="onAdd()"
    >
      <i class="bi bi-plus-lg"></i>
      <span>Agregar</span>
    </button>
    } @else{
    <button
      type="button"
      class="btn-update"
      title="Actualizar producto"
      (click)="onUpdate()"
    >
      <i class="bi bi-check-lg"></i>
      <span>Actualizar</span>
    </button>
    }
  </div>
</form>
