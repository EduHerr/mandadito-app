<div class="dock dock-sm bg-orange-900 font-bold">
  @for(itemMenu of mItems; track itemMenu){
    <button
      class="border-0"
      [routerLink]="itemMenu.route"
      [ngClass]="{'dock-active': itemMenu?.isActive}"
    >
      <i [ngClass]="itemMenu.icon"></i>
      <span class="dock-label">{{ itemMenu.label }}</span>
    </button>
  }
</div>
