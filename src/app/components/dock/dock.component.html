<nav class="dock-nav">
  @for(item of mItems; track item.route){
    <a
      [routerLink]="item.route"
      class="dock-item"
      [class.active]="isActive(item.route)"
    >
      <i [class]="item.icon" class="dock-icon"></i>
      <span class="dock-label">{{ item.label }}</span>
    </a>
  }
</nav>
