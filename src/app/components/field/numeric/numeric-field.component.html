<input
    #inpNumeric
    [id]="id"
    type="text"
    inputmode="decimal"
    [placeholder]="placeholder"
    [min]="min"
    [max]="max"
    [class.field-error]="error"
    [(ngModel)]="value"
    (input)="onInput($event)"
/>
@if(error && errorMessage){
    <span class="error-label">
        {{ errorMessage }}
    </span>
}
