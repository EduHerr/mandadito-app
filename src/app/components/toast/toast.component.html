@if(toast){
<div class="fixed top-5 right-5 z-50 transition-all duration-300">
  <div
    class="px-4 py-3 rounded-lg shadow-lg text-white animate-fade-in"
    [ngClass]="{
      'bg-orange-300': toast.type === 'success',
      'bg-red-600': toast.type === 'error',
      'bg-blue-600': toast.type === 'info'
    }"
  >
    {{ toast.text }}
  </div>
</div>
}
